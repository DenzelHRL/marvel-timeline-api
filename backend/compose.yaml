services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-marvel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marvel_dev_only}
      POSTGRES_DB: ${DB_NAME:-marvel_timeline}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - marvel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-marvel} -d ${DB_NAME:-marvel_timeline}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - marvel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  marvel_postgres_data:
  marvel_redis_data: